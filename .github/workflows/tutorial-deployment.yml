name: Tutorial Deployment

on:
  push:
    branches:
      - main
    paths:
      - "tutorial/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: tutorial
      url: https://f1-grandprix-game.netlify.app/

    steps:
      - uses: actions/checkout@v4

      - name: Deployment complete
        run: echo "Tutorial deployed to Netlify."